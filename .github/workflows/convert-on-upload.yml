name: Convert Uploaded Activities

on:
  push:
    branches: [main]
    paths:
      - "input/**"
      - ".github/workflows/convert-on-upload.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Detect input files
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || [[ -z "$BEFORE" ]] || [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            mapfile -t files < <(find input -maxdepth 1 -type f \( -name "*.json" -o -name "*.zip" \) | sort)
          else
            mapfile -t files < <(git diff --name-only "$BEFORE" "$AFTER" -- 'input/*.json' 'input/*.zip' | sort)
          fi

          if [[ ${#files[@]} -eq 0 ]]; then
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_files=true" >> "$GITHUB_OUTPUT"

          {
            echo "files<<EOF"
            printf '%s\n' "${files[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Convert changed files
        if: steps.detect.outputs.has_files == 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p web/public/results

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue

            ext="${file##*.}"
            if [[ "$ext" == "json" ]]; then
              uv run hicoros --json "$file" --output_dir web/public/results
            elif [[ "$ext" == "zip" ]]; then
              uv run hicoros --zip "$file" --output_dir web/public/results
            fi
          done <<< "${{ steps.detect.outputs.files }}"

      - name: Commit and push results
        if: steps.detect.outputs.has_files == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add web/public/results

          if git diff --cached --quiet; then
            echo "No generated FIT changes to commit."
            exit 0
          fi

          git commit -m "chore: convert uploaded input files to FIT"
          git push
