name: Validate Track Checks

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  validate-track:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run validate_track related tests
        run: |
          pytest -q tests/test_track_validation.py tests/test_cli.py -k "validate_track or track_validation"
